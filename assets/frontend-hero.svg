<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="460" viewBox="0 0 1200 460" role="img" aria-label="Premium Frontend Designer and Developer">
<title>Premium Frontend Developer — animated hero</title>
<defs>
<linearGradient id="fh-bg" x1="0" y1="0" x2="1" y2="1">
<stop offset="0" stop-color="#0B1220"/><stop offset="0.55" stop-color="#0A0F1A"/><stop offset="1" stop-color="#0C1424"/>
</linearGradient>
<linearGradient id="fh-accent" x1="0" y1="0" x2="1" y2="0">
<stop offset="0" stop-color="#22d3ee"/><stop offset="1" stop-color="#7DD3FC"/>
</linearGradient>
<linearGradient id="fh-head" x1="0" y1="0" x2="1" y2="0">
<stop offset="0" stop-color="#F8FAFC"/><stop offset="1" stop-color="#A5F3FC"/>
</linearGradient>
<pattern id="fh-grid" width="40" height="40" patternUnits="userSpaceOnUse">
<path d="M40 0H0V40" fill="none" stroke="#1E293B" stroke-width="1" opacity="0.45"/>
</pattern>
<clipPath id="fh-clip"><rect x="0" y="0" width="1200" height="460" rx="24"/></clipPath>
<style>
.font-sans{font-family:Inter,ui-sans-serif,system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif}
.font-mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace}
@keyframes fhUp{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:translateY(0)}}
@keyframes fhFloat{from{transform:translateY(-6px)}to{transform:translateY(6px)}}
@keyframes fhPulse{0%,100%{opacity:1}50%{opacity:.25}}
.r1{animation:fhUp .7s cubic-bezier(.16,1,.3,1) .05s both}
.r2{animation:fhUp .7s cubic-bezier(.16,1,.3,1) .15s both}
.r3{animation:fhUp .7s cubic-bezier(.16,1,.3,1) .28s both}
.r4{animation:fhUp .7s cubic-bezier(.16,1,.3,1) .40s both}
.r5{animation:fhUp .7s cubic-bezier(.16,1,.3,1) .52s both}
.r6{animation:fhUp .7s cubic-bezier(.16,1,.3,1) .64s both}
.float-a{animation:fhFloat 5s ease-in-out infinite alternate}
.float-b{animation:fhFloat 6.5s ease-in-out .8s infinite alternate}
.pulse{animation:fhPulse 2.2s ease-in-out infinite}
@media (prefers-reduced-motion:reduce){*{animation:none !important}}
</style>
</defs>
<rect x="0" y="0" width="1200" height="460" rx="24" fill="url(#fh-bg)" stroke="#1E293B" stroke-width="1.5"/>
<g clip-path="url(#fh-clip)">
<rect x="0" y="0" width="1200" height="460" fill="url(#fh-grid)" opacity="0.35"/>
<ellipse class="float-a" cx="1040" cy="80" rx="280" ry="140" fill="#22d3ee" opacity="0.07"/>
<ellipse class="float-b" cx="150" cy="410" rx="260" ry="110" fill="#7DD3FC" opacity="0.06"/>
<ellipse cx="880" cy="410" rx="300" ry="120" fill="#22d3ee" opacity="0.04"/>
</g>
<g class="r1">
<rect x="64" y="36" width="300" height="36" rx="18" fill="#0F172A" stroke="#1E293B" stroke-width="1.2"/>
<circle class="pulse" cx="88" cy="54" r="6" fill="#34D399"/>
<text x="104" y="60" class="font-mono" font-size="14" fill="#CBD5E1">Available · Frontend Work</text>
<text x="1136" y="60" class="font-mono" font-size="13.5" fill="#64748B" text-anchor="end">Kolkata · IN</text>
</g>
<g class="r2">
<text x="64" y="148" class="font-sans" font-size="56" font-weight="800" fill="url(#fh-head)" letter-spacing="-1.5">Premium Frontend</text>
<text x="64" y="206" class="font-sans" font-size="56" font-weight="800" fill="url(#fh-accent)" letter-spacing="-1.5">Designer &amp; Developer</text>
</g>
<g class="r3">
<rect x="64" y="226" width="440" height="5" rx="2.5" fill="url(#fh-accent)" opacity="0.9"/>
<rect x="64" y="226" width="70" height="5" rx="2.5" fill="#FFFFFF" opacity="0.85">
<animate attributeName="x" values="64;434;64" dur="3.2s" repeatCount="indefinite"/>
</rect>
<text x="64" y="260" class="font-sans" font-size="16.5" fill="#94A3B8">Pixel-perfect · responsive-first · buttery motion.</text>
<text x="64" y="284" class="font-sans" font-size="16.5" fill="#94A3B8">Landing pages · e-commerce UI · dashboards · 3D web.</text>
</g>
<g class="r4">
<rect x="64" y="306" width="200" height="34" rx="17" fill="none" stroke="#334155" stroke-width="1.2"/>
<text x="164" y="328" class="font-mono" font-size="13.5" fill="#CBD5E1" text-anchor="middle">React 19 · Next.js</text>
<rect x="274" y="306" width="200" height="34" rx="17" fill="none" stroke="#334155" stroke-width="1.2"/>
<text x="374" y="328" class="font-mono" font-size="13.5" fill="#CBD5E1" text-anchor="middle">Tailwind v4 · shadcn</text>
<rect x="484" y="306" width="196" height="34" rx="17" fill="none" stroke="#334155" stroke-width="1.2"/>
<text x="582" y="328" class="font-mono" font-size="13.5" fill="#CBD5E1" text-anchor="middle">Motion · Three.js</text>
</g>
<g class="r5">
<rect x="64" y="356" width="232" height="48" rx="14" fill="#22d3ee"/>
<text x="180" y="386" class="font-sans" font-size="16" font-weight="700" fill="#06251F" text-anchor="middle">View live builds ↓</text>
<rect x="308" y="356" width="212" height="48" rx="14" fill="none" stroke="#334155" stroke-width="1.4"/>
<text x="414" y="386" class="font-mono" font-size="14" fill="#CBD5E1" text-anchor="middle">Figma → Code</text>
</g>
<g class="r6">
<rect x="772" y="72" width="364" height="308" rx="16" fill="#0F172A" stroke="#1E293B" stroke-width="1.4"/>
<rect x="772" y="72" width="364" height="52" rx="16" fill="#111C30"/>
<rect x="772" y="104" width="364" height="20" fill="#0F172A"/>
<circle cx="800" cy="98" r="6" fill="#F87171" opacity="0.9"/>
<circle cx="820" cy="98" r="6" fill="#FBBF24" opacity="0.9"/>
<circle cx="840" cy="98" r="6" fill="#34D399" opacity="0.9"/>
<text x="1060" y="102" class="font-mono" font-size="12.5" fill="#64748B" text-anchor="end">ui-profile.tsx</text>
<text x="800" y="158" class="font-mono" font-size="14.5" fill="#7DD3FC">const <tspan fill="#F8FAFC">dev</tspan> <tspan fill="#94A3B8">= {</tspan></text>
<text x="820" y="184" class="font-mono" font-size="14.5" fill="#7DD3FC">role: <tspan fill="#22d3ee">"Frontend Designer"</tspan><tspan fill="#94A3B8">,</tspan></text>
<text x="820" y="210" class="font-mono" font-size="14.5" fill="#7DD3FC">stack: <tspan fill="#94A3B8">[</tspan><tspan fill="#22d3ee">"React"</tspan><tspan fill="#94A3B8">,</tspan><tspan fill="#22d3ee"> "Next"</tspan><tspan fill="#94A3B8">],</tspan></text>
<text x="820" y="236" class="font-mono" font-size="14.5" fill="#7DD3FC">craft: <tspan fill="#22d3ee">"motion + SEO"</tspan><tspan fill="#94A3B8">,</tspan></text>
<text x="820" y="262" class="font-mono" font-size="14.5" fill="#7DD3FC">base: <tspan fill="#22d3ee">"Kolkata, IN"</tspan></text>
<text x="800" y="288" class="font-mono" font-size="14.5" fill="#94A3B8">};</text>
<rect x="822" y="276" width="9" height="17" fill="#22d3ee">
<animate attributeName="opacity" values="1;0;1" dur="1.1s" repeatCount="indefinite"/>
</rect>
<text x="800" y="340" class="font-mono" font-size="12.5" fill="#64748B">pixel-perfect · responsive · fast</text>
</g>
<g class="float-a">
<rect x="736" y="132" width="150" height="36" rx="18" fill="#0F172A" stroke="#22d3ee" stroke-width="1.2" opacity="0.98"/>
<circle cx="756" cy="150" r="5" fill="#22d3ee"/>
<text x="868" y="155" class="font-mono" font-size="13" fill="#E2E8F0" text-anchor="middle">React 19</text>
</g>
<g class="float-b">
<rect x="988" y="322" width="164" height="36" rx="18" fill="#0F172A" stroke="#7DD3FC" stroke-width="1.2" opacity="0.98"/>
<circle cx="1008" cy="340" r="5" fill="#7DD3FC"/>
<text x="1092" y="345" class="font-mono" font-size="13" fill="#E2E8F0" text-anchor="middle">Tailwind v4</text>
</g>
</svg>