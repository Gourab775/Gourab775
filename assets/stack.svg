<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="700" viewBox="0 0 1200 700" role="img" aria-label="Tech stack">
<title>Real stack — from shipped repos</title>
<defs>
<linearGradient id="stack-bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0B1220"/><stop offset="1" stop-color="#0A0F1A"/></linearGradient>
<clipPath id="stack-clip"><rect x="0" y="0" width="1200" height="700" rx="24"/></clipPath>
<style>
.font-sans{font-family:Inter,ui-sans-serif,system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif}
.font-mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
@keyframes stackUp{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:translateY(0)}}
.s1{animation:stackUp .7s cubic-bezier(.16,1,.3,1) .05s both}
.s2{animation:stackUp .7s cubic-bezier(.16,1,.3,1) .15s both}
.s3{animation:stackUp .7s cubic-bezier(.16,1,.3,1) .25s both}
.s4{animation:stackUp .7s cubic-bezier(.16,1,.3,1) .35s both}
.s5{animation:stackUp .7s cubic-bezier(.16,1,.3,1) .45s both}
.s6{animation:stackUp .7s cubic-bezier(.16,1,.3,1) .55s both}
@media (prefers-reduced-motion:reduce){*{animation:none !important}}
.pill{fill:#0F172A;stroke:#1E293B;stroke-width:1.2}
.plabel{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:13.5px;fill:#E2E8F0}
</style>
</defs>
<rect x="0" y="0" width="1200" height="700" rx="24" fill="url(#stack-bg)" stroke="#1E293B" stroke-width="1.5"/>
<g clip-path="url(#stack-clip)">
<ellipse cx="1050" cy="60" rx="260" ry="110" fill="#5EEAD4" opacity="0.05"/>
<ellipse cx="120" cy="660" rx="260" ry="110" fill="#7DD3FC" opacity="0.05"/>
</g>
<g class="s1">
<text x="64" y="64" class="font-mono" font-size="13" letter-spacing="2.5" fill="#5EEAD4">STACK</text>
<text x="64" y="102" class="font-sans" font-size="36" font-weight="800" fill="#F8FAFC" letter-spacing="-0.8">Real stack — from shipped repos</text>
<text x="64" y="130" class="font-sans" font-size="15" fill="#94A3B8">Only what appears with meaningful usage across 48 public repos. No filler.</text>
</g>
<!-- FRONTEND -->
<g class="s2">
<rect x="64" y="152" width="4" height="88" rx="2" fill="#5EEAD4"/>
<text x="80" y="172" class="font-mono" font-size="12.5" letter-spacing="1.5" fill="#94A3B8">FRONTEND</text>
<text x="80" y="196" class="font-sans" font-size="16" font-weight="700" fill="#F1F5F9">Next.js · React · TypeScript UI</text>
<g>
<rect x="80" y="208" width="118" height="32" rx="16" class="pill"/><circle cx="98" cy="224" r="5" fill="#5EEAD4"/><text x="110" y="229" class="plabel">Next.js 16</text>
<rect x="206" y="208" width="108" height="32" rx="16" class="pill"/><circle cx="224" cy="224" r="5" fill="#5EEAD4"/><text x="236" y="229" class="plabel">React 19</text>
<rect x="322" y="208" width="122" height="32" rx="16" class="pill"/><circle cx="340" cy="224" r="5" fill="#5EEAD4"/><text x="352" y="229" class="plabel">TypeScript</text>
<rect x="452" y="208" width="122" height="32" rx="16" class="pill"/><circle cx="470" cy="224" r="5" fill="#5EEAD4"/><text x="482" y="229" class="plabel">JavaScript</text>
<rect x="582" y="208" width="148" height="32" rx="16" class="pill"/><circle cx="600" cy="224" r="5" fill="#5EEAD4"/><text x="612" y="229" class="plabel">Tailwind CSS 4</text>
<rect x="738" y="208" width="138" height="32" rx="16" class="pill"/><circle cx="756" cy="224" r="5" fill="#5EEAD4"/><text x="768" y="229" class="plabel">Radix / shadcn</text>
<rect x="884" y="208" width="104" height="32" rx="16" class="pill"/><circle cx="902" cy="224" r="5" fill="#5EEAD4"/><text x="914" y="229" class="plabel">Motion</text>
<rect x="996" y="208" width="84" height="32" rx="16" class="pill"/><circle cx="1014" cy="224" r="5" fill="#5EEAD4"/><text x="1026" y="229" class="plabel">Lenis</text>
</g>
</g>
<!-- BACKEND -->
<g class="s3">
<rect x="64" y="262" width="4" height="88" rx="2" fill="#7DD3FC"/>
<text x="80" y="282" class="font-mono" font-size="12.5" letter-spacing="1.5" fill="#94A3B8">BACKEND + DATA</text>
<text x="80" y="306" class="font-sans" font-size="16" font-weight="700" fill="#F1F5F9">Serverless APIs · Postgres · Auth</text>
<rect x="80" y="318" width="92" height="32" rx="16" class="pill"/><circle cx="98" cy="334" r="5" fill="#7DD3FC"/><text x="110" y="339" class="plabel">Node.js</text>
<rect x="180" y="318" width="168" height="32" rx="16" class="pill"/><circle cx="198" cy="334" r="5" fill="#7DD3FC"/><text x="210" y="339" class="plabel">App Router APIs</text>
<rect x="356" y="318" width="172" height="32" rx="16" class="pill"/><circle cx="374" cy="334" r="5" fill="#7DD3FC"/><text x="386" y="339" class="plabel">Supabase Postgres</text>
<rect x="536" y="318" width="152" height="32" rx="16" class="pill"/><circle cx="554" cy="334" r="5" fill="#7DD3FC"/><text x="566" y="339" class="plabel">Neon Postgres</text>
<rect x="696" y="318" width="128" height="32" rx="16" class="pill"/><circle cx="714" cy="334" r="5" fill="#7DD3FC"/><text x="726" y="339" class="plabel">Clerk Auth</text>
<rect x="832" y="318" width="78" height="32" rx="16" class="pill"/><circle cx="850" cy="334" r="5" fill="#7DD3FC"/><text x="862" y="339" class="plabel">Zod</text>
<rect x="918" y="318" width="162" height="32" rx="16" class="pill"/><circle cx="936" cy="334" r="5" fill="#7DD3FC"/><text x="948" y="339" class="plabel">Hook Form</text>
</g>
<!-- AI -->
<g class="s4">
<rect x="64" y="372" width="4" height="88" rx="2" fill="#C4B5FD"/>
<text x="80" y="392" class="font-mono" font-size="12.5" letter-spacing="1.5" fill="#94A3B8">AI / AGENTS</text>
<text x="80" y="416" class="font-sans" font-size="16" font-weight="700" fill="#F1F5F9">Orchestrated assistants · RAG patterns · streaming</text>
<rect x="80" y="428" width="118" height="32" rx="16" class="pill"/><circle cx="98" cy="444" r="5" fill="#C4B5FD"/><text x="110" y="449" class="plabel">LangGraph</text>
<rect x="206" y="428" width="118" height="32" rx="16" class="pill"/><circle cx="224" cy="444" r="5" fill="#C4B5FD"/><text x="236" y="449" class="plabel">LangChain</text>
<rect x="332" y="428" width="178" height="32" rx="16" class="pill"/><circle cx="350" cy="444" r="5" fill="#C4B5FD"/><text x="362" y="449" class="plabel">OpenAI Agents SDK</text>
<rect x="518" y="428" width="152" height="32" rx="16" class="pill"/><circle cx="536" cy="444" r="5" fill="#C4B5FD"/><text x="548" y="449" class="plabel">CrewAI patterns</text>
<rect x="678" y="428" width="128" height="32" rx="16" class="pill"/><circle cx="696" cy="444" r="5" fill="#C4B5FD"/><text x="708" y="449" class="plabel">OpenRouter</text>
<rect x="814" y="428" width="118" height="32" rx="16" class="pill"/><circle cx="832" cy="444" r="5" fill="#C4B5FD"/><text x="844" y="449" class="plabel">Google AI</text>
</g>
<!-- 3D -->
<g class="s5">
<rect x="64" y="482" width="4" height="88" rx="2" fill="#FCD34D"/>
<text x="80" y="502" class="font-mono" font-size="12.5" letter-spacing="1.5" fill="#94A3B8">3D + VISUAL</text>
<text x="80" y="526" class="font-sans" font-size="16" font-weight="700" fill="#F1F5F9">WebGL scenes · charts · rich interaction</text>
<rect x="80" y="538" width="112" height="32" rx="16" class="pill"/><circle cx="98" cy="554" r="5" fill="#FCD34D"/><text x="110" y="559" class="plabel">Three.js</text>
<rect x="200" y="538" width="172" height="32" rx="16" class="pill"/><circle cx="218" cy="554" r="5" fill="#FCD34D"/><text x="230" y="559" class="plabel">React Three Fiber</text>
<rect x="380" y="538" width="78" height="32" rx="16" class="pill"/><circle cx="398" cy="554" r="5" fill="#FCD34D"/><text x="410" y="559" class="plabel">Drei</text>
<rect x="466" y="538" width="108" height="32" rx="16" class="pill"/><circle cx="484" cy="554" r="5" fill="#FCD34D"/><text x="496" y="559" class="plabel">Recharts</text>
<rect x="582" y="538" width="132" height="32" rx="16" class="pill"/><circle cx="600" cy="554" r="5" fill="#FCD34D"/><text x="612" y="559" class="plabel">Embla · Lottie</text>
<rect x="722" y="538" width="168" height="32" rx="16" class="pill"/><circle cx="740" cy="554" r="5" fill="#FCD34D"/><text x="752" y="559" class="plabel">Framer Motion</text>
</g>
<!-- SHIP -->
<g class="s6">
<rect x="64" y="592" width="1072" height="52" rx="14" fill="#0C1526" stroke="#1E293B" stroke-width="1.2"/>
<circle cx="92" cy="618" r="5" fill="#5EEAD4"/>
<text x="106" y="623" class="font-mono" font-size="13.5" fill="#CBD5E1">Ship: Vercel · Vite · GitHub · Cloudinary · Vercel Analytics — evidence in package.json + READMEs, not dependencies alone</text>
</g>
</svg>