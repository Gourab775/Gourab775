<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="560" viewBox="0 0 1200 560" role="img" aria-label="Gourab live mission deck — animated activity console">
<title>Live mission deck — interactive animated console</title>
<defs>
<linearGradient id="ld-bg" x1="0" y1="0" x2="0" y2="1">
<stop offset="0" stop-color="#0D1526"/><stop offset="1" stop-color="#0A0F1A"/>
</linearGradient>
<linearGradient id="ld-accent" x1="0" y1="0" x2="1" y2="0">
<stop offset="0" stop-color="#22d3ee"/><stop offset="1" stop-color="#7DD3FC"/>
</linearGradient>
<linearGradient id="ld-bar" x1="0" y1="0" x2="0" y2="1">
<stop offset="0" stop-color="#69f0a0"/><stop offset="1" stop-color="#26a641"/>
</linearGradient>
<pattern id="ld-grid" width="40" height="40" patternUnits="userSpaceOnUse">
<path d="M40 0H0V40" fill="none" stroke="#1E293B" stroke-width="1" opacity="0.4"/>
</pattern>
<clipPath id="ld-clip"><rect x="0" y="0" width="1200" height="560" rx="20"/></clipPath>
<style>
.font-mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace}
.font-sans{font-family:Inter,ui-sans-serif,system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif}
@keyframes ldRise{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:translateY(0)}}
@keyframes ldBlink{0%,100%{opacity:1}50%{opacity:0}}
@keyframes ldPulse{0%,100%{opacity:1}50%{opacity:.3}}
@keyframes ldEq{0%,100%{transform:scaleY(1)}50%{transform:scaleY(.84)}}
@keyframes ldFloat{from{transform:translateY(-4px)}to{transform:translateY(4px)}}
.l1{animation:ldRise .7s cubic-bezier(.16,1,.3,1) .05s both}
.l2{animation:ldRise .7s cubic-bezier(.16,1,.3,1) .18s both}
.l3{animation:ldRise .7s cubic-bezier(.16,1,.3,1) .32s both}
.l4{animation:ldRise .7s cubic-bezier(.16,1,.3,1) .46s both}
.cursor{animation:ldBlink 1.1s steps(1) infinite}
.live-dot{animation:ldPulse 1.8s ease-in-out infinite}
.float-a{animation:ldFloat 5s ease-in-out infinite alternate}
.eq{animation:ldEq 2.6s ease-in-out infinite;transform-box:fill-box;transform-origin:bottom}
.hov{transition:stroke .2s ease}
.hov:hover{stroke:#22d3ee;stroke-width:2}
.bar:hover{stroke:#A5F3FC;stroke-width:2}
@media (prefers-reduced-motion:reduce){*{animation:none !important}}
</style>
</defs>
<rect x="0" y="0" width="1200" height="560" rx="20" fill="url(#ld-bg)" stroke="#1E293B" stroke-width="1.5"/>
<g clip-path="url(#ld-clip)">
<rect x="0" y="0" width="1200" height="560" fill="url(#ld-grid)" opacity="0.32"/>
<ellipse class="float-a" cx="1020" cy="60" rx="300" ry="120" fill="#22d3ee" opacity="0.07"/>
<ellipse cx="180" cy="520" rx="280" ry="100" fill="#7DD3FC" opacity="0.05"/>
<rect x="60" y="120" width="70" height="360" rx="8" fill="#FFFFFF" opacity="0.05">
<animate attributeName="x" values="40;1130;40" dur="7s" repeatCount="indefinite"/>
</rect>
</g>
<!-- header -->
<g class="l1">
<circle cx="92" cy="28" r="6" fill="#F87171" opacity="0.9"/>
<circle cx="112" cy="28" r="6" fill="#FBBF24" opacity="0.9"/>
<circle cx="132" cy="28" r="6" fill="#34D399" opacity="0.9"/>
<text x="152" y="33" class="font-mono" font-size="13" fill="#94A3B8">gourab.live — mission deck</text>
<text x="600" y="33" class="font-mono" font-size="12.5" fill="#64748B" text-anchor="middle">2025-10-05 → 2026-10-06 · public data · auto-refreshes daily</text>
<rect x="1000" y="12" width="136" height="32" rx="16" fill="#052E2B" stroke="#22d3ee" stroke-width="1.2" class="hov">
<title>Live status — open for frontend work</title>
</rect>
<circle cx="1022" cy="28" r="6" fill="#34D399" class="live-dot"/>
<text x="1036" y="33" class="font-mono" font-size="13" font-weight="700" fill="#A5F3FC" letter-spacing="1.5">● LIVE</text>
</g>
<line x1="0" y1="56" x2="1200" y2="56" stroke="#1E293B" stroke-width="1.5"/>
<!-- left terminal -->
<g class="l2">
<rect x="64" y="80" width="484" height="238" rx="16" fill="#0F172A" stroke="#1E293B" stroke-width="1.4" class="hov">
<title>Live console — hover me. Expand the section below for details.</title>
</rect>
<rect x="64" y="80" width="484" height="5" rx="2.5" fill="url(#ld-accent)" opacity="0.9"/>
<text x="92" y="116" class="font-mono" font-size="13" fill="#64748B">$ whoami</text>
<text x="92" y="140" class="font-sans" font-size="18" font-weight="700" fill="#F8FAFC">gourab — frontend designer &amp; developer</text>
<text x="92" y="170" class="font-mono" font-size="13" fill="#64748B">$ focus --now</text>
<text x="92" y="194" class="font-mono" font-size="15" fill="#22d3ee">premium React / Next / Motion builds</text>
<text x="92" y="224" class="font-mono" font-size="13" fill="#64748B">$ status --open</text>
<text x="92" y="248" class="font-mono" font-size="15" font-weight="700" fill="#34D399">● OPEN FOR WORK — replies &lt;48h</text>
<rect x="398" y="236" width="9" height="17" fill="#34D399" class="cursor"/>
<text x="92" y="284" class="font-mono" font-size="12.5" fill="#94A3B8">pixel-perfect · responsive · fast · SEO-ready</text>
</g>
<!-- right stats 2x2 -->
<g class="l3">
<g>
<rect x="572" y="80" width="272" height="109" rx="14" fill="#0F172A" stroke="#1E293B" stroke-width="1.3" class="hov"><title>Total contributions in the last year: 1615</title></rect>
<rect x="572" y="80" width="272" height="4" rx="2" fill="#34D399" opacity="0.9"/>
<text x="594" y="116" class="font-mono" font-size="12" letter-spacing="1.5" fill="#64748B">TOTAL</text>
<text x="594" y="150" class="font-sans" font-size="36" font-weight="800" fill="#34D399">1,631</text>
<text x="594" y="172" class="font-mono" font-size="12.5" fill="#94A3B8">contributions / last year</text>
</g>
<g>
<rect x="864" y="80" width="272" height="109" rx="14" fill="#0F172A" stroke="#1E293B" stroke-width="1.3" class="hov"><title>Current streak 4 days · longest 30 days</title></rect>
<rect x="864" y="80" width="272" height="4" rx="2" fill="#22d3ee" opacity="0.9"/>
<text x="886" y="116" class="font-mono" font-size="12" letter-spacing="1.5" fill="#64748B">STREAK</text>
<text x="886" y="150" class="font-sans" font-size="36" font-weight="800" fill="#22d3ee">2 days</text>
<text x="886" y="172" class="font-mono" font-size="12.5" fill="#94A3B8">current · longest 30</text>
</g>
<g>
<rect x="572" y="209" width="272" height="109" rx="14" fill="#0F172A" stroke="#1E293B" stroke-width="1.3" class="hov"><title>Best day: 124 contributions on 2026-08-29</title></rect>
<rect x="572" y="209" width="272" height="4" rx="2" fill="#FCD34D" opacity="0.9"/>
<text x="594" y="245" class="font-mono" font-size="12" letter-spacing="1.5" fill="#64748B">BEST DAY</text>
<text x="594" y="279" class="font-sans" font-size="36" font-weight="800" fill="#FCD34D">124</text>
<text x="594" y="301" class="font-mono" font-size="12.5" fill="#94A3B8">on 2026-08-29</text>
</g>
<g>
<rect x="864" y="209" width="272" height="109" rx="14" fill="#0F172A" stroke="#1E293B" stroke-width="1.3" class="hov"><title>312 active days · 5.2 avg per active day</title></rect>
<rect x="864" y="209" width="272" height="4" rx="2" fill="#7DD3FC" opacity="0.9"/>
<text x="886" y="245" class="font-mono" font-size="12" letter-spacing="1.5" fill="#64748B">ACTIVE</text>
<text x="886" y="279" class="font-sans" font-size="36" font-weight="800" fill="#F8FAFC">312d</text>
<text x="886" y="301" class="font-mono" font-size="12.5" fill="#94A3B8">active · 5.2 / day</text>
</g>
</g>
<!-- activity pulse -->
<g class="l4">
<rect x="64" y="338" width="1072" height="162" rx="16" fill="#0F172A" stroke="#1E293B" stroke-width="1.4"/>
<text x="92" y="368" class="font-mono" font-size="12.5" letter-spacing="2" fill="#22d3ee">ACTIVITY PULSE · LAST 13 MONTHS</text>
<text x="1108" y="368" class="font-mono" font-size="12" fill="#64748B" text-anchor="end">hover any bar ↑ exact count</text>
<g>
<rect class="bar eq" style="animation-delay:0s" x="96" y="435.9" width="56" height="26.1" rx="6" fill="#0e4429" stroke="#1E293B"><title>2025-10: 52 contributions</title></rect>
<rect class="bar eq" style="animation-delay:.15s" x="172" y="433.5" width="56" height="28.5" rx="6" fill="#0e4429" stroke="#1E293B"><title>2025-11: 61 contributions</title></rect>
<rect class="bar eq" style="animation-delay:.3s" x="248" y="432.9" width="56" height="29.1" rx="6" fill="#0e4429" stroke="#1E293B"><title>2025-12: 63 contributions</title></rect>
<rect class="bar eq" style="animation-delay:.45s" x="324" y="433.2" width="56" height="28.8" rx="6" fill="#0e4429" stroke="#1E293B"><title>2026-01: 62 contributions</title></rect>
<rect class="bar eq" style="animation-delay:.6s" x="400" y="436.5" width="56" height="25.5" rx="6" fill="#0e4429" stroke="#1E293B"><title>2026-02: 50 contributions</title></rect>
<rect class="bar eq" style="animation-delay:.75s" x="476" y="412.4" width="56" height="49.6" rx="6" fill="#26a641" stroke="#1E293B"><title>2026-03: 139 contributions</title></rect>
<rect class="bar eq" style="animation-delay:.9s" x="552" y="395" width="56" height="67" rx="6" fill="url(#ld-bar)" stroke="#34D399"><title>2026-04: 203 contributions</title></rect>
<rect class="bar eq" style="animation-delay:1.05s" x="628" y="372.3" width="56" height="89.7" rx="6" fill="url(#ld-bar)" stroke="#34D399"><title>2026-05: 287 contributions</title></rect>
<rect class="bar eq" style="animation-delay:1.2s" x="704" y="405.9" width="56" height="56.1" rx="6" fill="#26a641" stroke="#1E293B"><title>2026-06: 163 contributions</title></rect>
<rect class="bar eq" style="animation-delay:1.35s" x="780" y="424.5" width="56" height="37.5" rx="6" fill="#006d32" stroke="#1E293B"><title>2026-07: 94 contributions</title></rect>
<rect class="bar eq" style="animation-delay:1.5s" x="856" y="372" width="56" height="90" rx="6" fill="url(#ld-bar)" stroke="#A5F3FC" stroke-width="1.5"><title>2026-08: 288 contributions — peak</title></rect>
<rect class="bar eq" style="animation-delay:1.65s" x="932" y="416.1" width="56" height="45.9" rx="6" fill="#26a641" stroke="#1E293B"><title>2026-09: 125 contributions</title></rect>
<rect class="bar eq" style="animation-delay:1.8s" x="1008" y="442.4" width="56" height="19.6" rx="6" fill="#0e4429" stroke="#1E293B"><title>2026-10: 28 contributions (partial)</title></rect>
</g>
<text x="124" y="482" class="font-mono" font-size="11" fill="#64748B" text-anchor="middle">O</text>
<text x="200" y="482" class="font-mono" font-size="11" fill="#64748B" text-anchor="middle">N</text>
<text x="276" y="482" class="font-mono" font-size="11" fill="#64748B" text-anchor="middle">D</text>
<text x="352" y="482" class="font-mono" font-size="11" fill="#64748B" text-anchor="middle">J</text>
<text x="428" y="482" class="font-mono" font-size="11" fill="#64748B" text-anchor="middle">F</text>
<text x="504" y="482" class="font-mono" font-size="11" fill="#64748B" text-anchor="middle">M</text>
<text x="580" y="482" class="font-mono" font-size="11" fill="#64748B" text-anchor="middle">A</text>
<text x="656" y="482" class="font-mono" font-size="11" fill="#FCD34D" text-anchor="middle">M</text>
<text x="732" y="482" class="font-mono" font-size="11" fill="#64748B" text-anchor="middle">J</text>
<text x="808" y="482" class="font-mono" font-size="11" fill="#64748B" text-anchor="middle">J</text>
<text x="884" y="482" class="font-mono" font-size="11" fill="#34D399" text-anchor="middle">A★</text>
<text x="960" y="482" class="font-mono" font-size="11" fill="#64748B" text-anchor="middle">S</text>
<text x="1036" y="482" class="font-mono" font-size="11" fill="#64748B" text-anchor="middle">O</text>
<circle cx="656" cy="360" r="4" fill="#A5F3FC" opacity="0.9">
<animate attributeName="cy" values="365;335;365" dur="2.8s" repeatCount="indefinite"/>
<animate attributeName="opacity" values="0.9;0.1;0.9" dur="2.8s" repeatCount="indefinite"/>
</circle>
<circle cx="884" cy="358" r="5" fill="#FCD34D" opacity="0.9">
<animate attributeName="cy" values="362;330;362" dur="3.2s" repeatCount="indefinite"/>
<animate attributeName="opacity" values="0.9;0.1;0.9" dur="3.2s" repeatCount="indefinite"/>
</circle>
</g>
<text x="64" y="530" class="font-mono" font-size="12" fill="#64748B">↗ numbers auto-refresh daily via Actions · public data only</text>
<text x="1136" y="530" class="font-mono" font-size="12" fill="#64748B" text-anchor="end">tip: hover bars · expand below ↓</text>
</svg>
