<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="480" viewBox="0 0 1200 480" role="img" aria-label="Gourab Neogi - Full-Stack Developer">
<title>Gourab Neogi — Full-Stack Developer</title>
<defs>
<linearGradient id="hero-bg" x1="0" y1="0" x2="1" y2="1">
<stop offset="0" stop-color="#0B1220"/>
<stop offset="0.55" stop-color="#0A0F1A"/>
<stop offset="1" stop-color="#0C1424"/>
</linearGradient>
<linearGradient id="hero-accent" x1="0" y1="0" x2="1" y2="0">
<stop offset="0" stop-color="#5EEAD4"/>
<stop offset="1" stop-color="#7DD3FC"/>
</linearGradient>
<pattern id="hero-grid" width="40" height="40" patternUnits="userSpaceOnUse">
<path d="M40 0H0V40" fill="none" stroke="#1E293B" stroke-width="1" opacity="0.45"/>
</pattern>
<clipPath id="hero-clip"><rect x="0" y="0" width="1200" height="480" rx="24"/></clipPath>
<style>
.font-sans{font-family:Inter,ui-sans-serif,system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif}
.font-mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace}
@keyframes heroFadeUp{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:translateY(0)}}
@keyframes heroFloat{from{transform:translateY(-5px)}to{transform:translateY(5px)}}
@keyframes heroPulse{0%,100%{opacity:1}50%{opacity:.3}}
.r1{animation:heroFadeUp .8s cubic-bezier(.16,1,.3,1) .05s both}
.r2{animation:heroFadeUp .8s cubic-bezier(.16,1,.3,1) .15s both}
.r3{animation:heroFadeUp .8s cubic-bezier(.16,1,.3,1) .25s both}
.r4{animation:heroFadeUp .8s cubic-bezier(.16,1,.3,1) .35s both}
.r5{animation:heroFadeUp .8s cubic-bezier(.16,1,.3,1) .45s both}
.r6{animation:heroFadeUp .8s cubic-bezier(.16,1,.3,1) .55s both}
.r7{animation:heroFadeUp .8s cubic-bezier(.16,1,.3,1) .68s both}
.float-a{animation:heroFloat 5s ease-in-out infinite alternate}
.float-b{animation:heroFloat 6.5s ease-in-out .9s infinite alternate}
.pulse-dot{animation:heroPulse 2.2s ease-in-out infinite}
@media (prefers-reduced-motion:reduce){*{animation:none !important}}
</style>
</defs>
<rect x="0" y="0" width="1200" height="480" rx="24" fill="url(#hero-bg)" stroke="#1E293B" stroke-width="1.5"/>
<g clip-path="url(#hero-clip)">
<rect x="0" y="0" width="1200" height="480" fill="url(#hero-grid)" opacity="0.35"/>
<ellipse cx="1020" cy="70" rx="300" ry="150" fill="#5EEAD4" opacity="0.07"/>
<ellipse cx="880" cy="420" rx="320" ry="140" fill="#7DD3FC" opacity="0.06"/>
<ellipse cx="180" cy="420" rx="260" ry="120" fill="#5EEAD4" opacity="0.04"/>
</g>
<g class="r1">
<rect x="64" y="44" width="330" height="36" rx="18" fill="#0F172A" stroke="#1E293B" stroke-width="1.2"/>
<circle cx="88" cy="62" r="6" fill="#34D399" class="pulse-dot"/>
<text x="102" y="68" class="font-mono" font-size="14" fill="#CBD5E1" letter-spacing="0.2">Available · Kolkata, India</text>
<text x="1032" y="68" class="font-mono" font-size="13.5" fill="#64748B" text-anchor="end">github.com/Gourab775</text>
</g>
<g class="r2">
<text x="64" y="152" class="font-sans" font-size="62" font-weight="800" fill="#F8FAFC" letter-spacing="-1.5">Gourab Neogi</text>
<text x="66" y="186" class="font-mono" font-size="19" fill="#5EEAD4">@Gourab775 · Solo</text>
</g>
<g class="r3">
<rect x="64" y="206" width="440" height="4" rx="2" fill="url(#hero-accent)" opacity="0.9"/>
<text x="64" y="244" class="font-sans" font-size="22" font-weight="700" fill="#E2E8F0">Full-Stack Developer — Next.js · AI Apps · 3D Web</text>
</g>
<g class="r4">
<text x="64" y="276" class="font-sans" font-size="16.5" fill="#94A3B8">I build production-style dashboards, AI workspaces and cinematic</text>
<text x="64" y="300" class="font-sans" font-size="16.5" fill="#94A3B8">3D experiences with React, TypeScript, Supabase and agent stacks.</text>
</g>
<g class="r5">
<rect x="64" y="324" width="172" height="34" rx="17" fill="none" stroke="#334155" stroke-width="1.2"/>
<text x="150" y="346" class="font-mono" font-size="13.5" fill="#CBD5E1" text-anchor="middle">43 public repos</text>
<rect x="246" y="324" width="218" height="34" rx="17" fill="none" stroke="#334155" stroke-width="1.2"/>
<text x="355" y="346" class="font-mono" font-size="13.5" fill="#CBD5E1" text-anchor="middle">Next.js 16 · React 19</text>
<rect x="474" y="324" width="196" height="34" rx="17" fill="none" stroke="#334155" stroke-width="1.2"/>
<text x="572" y="346" class="font-mono" font-size="13.5" fill="#CBD5E1" text-anchor="middle">Supabase · Neon</text>
</g>
<g class="r6">
<rect x="64" y="378" width="240" height="48" rx="14" fill="#5EEAD4"/>
<text x="184" y="407" class="font-sans" font-size="16" font-weight="700" fill="#06251F" text-anchor="middle">Explore selected work</text>
<rect x="316" y="378" width="250" height="48" rx="14" fill="none" stroke="#334155" stroke-width="1.4"/>
<text x="441" y="407" class="font-mono" font-size="14" fill="#CBD5E1" text-anchor="middle">AI · Full-Stack · 3D</text>
</g>
<g class="r7">
<rect x="760" y="88" width="376" height="304" rx="16" fill="#0F172A" stroke="#1E293B" stroke-width="1.4"/>
<rect x="760" y="88" width="376" height="52" rx="16" fill="#111C30"/>
<rect x="760" y="120" width="376" height="20" fill="#0F172A"/>
<circle cx="788" cy="114" r="6" fill="#F87171" opacity="0.9"/>
<circle cx="808" cy="114" r="6" fill="#FBBF24" opacity="0.9"/>
<circle cx="828" cy="114" r="6" fill="#34D399" opacity="0.9"/>
<text x="1060" y="118" class="font-mono" font-size="12.5" fill="#64748B" text-anchor="end">profile.ts</text>
<text x="788" y="172" class="font-mono" font-size="14.5" fill="#7DD3FC">const <tspan fill="#F8FAFC">dev</tspan> <tspan fill="#94A3B8">= {</tspan></text>
<text x="808" y="198" class="font-mono" font-size="14.5" fill="#7DD3FC">name: <tspan fill="#5EEAD4">"Gourab Neogi"</tspan><tspan fill="#94A3B8">,</tspan></text>
<text x="808" y="224" class="font-mono" font-size="14.5" fill="#7DD3FC">stack: <tspan fill="#94A3B8">[</tspan><tspan fill="#5EEAD4">"Next.js"</tspan><tspan fill="#94A3B8">,</tspan><tspan fill="#5EEAD4"> "TS"</tspan><tspan fill="#94A3B8">],</tspan></text>
<text x="808" y="250" class="font-mono" font-size="14.5" fill="#7DD3FC">focus: <tspan fill="#5EEAD4">"AI + 3D web apps"</tspan><tspan fill="#94A3B8">,</tspan></text>
<text x="808" y="276" class="font-mono" font-size="14.5" fill="#7DD3FC">base: <tspan fill="#5EEAD4">"Kolkata, IN"</tspan></text>
<text x="788" y="302" class="font-mono" font-size="14.5" fill="#94A3B8">};</text>
<rect x="812" y="290" width="9" height="17" fill="#5EEAD4">
<animate attributeName="opacity" values="1;0;1" dur="1.1s" repeatCount="indefinite"/>
</rect>
<text x="788" y="352" class="font-mono" font-size="12.5" fill="#64748B">ships dashboards · agents · WebGL</text>
</g>
<g class="float-a">
<rect x="724" y="150" width="150" height="36" rx="18" fill="#0F172A" stroke="#5EEAD4" stroke-width="1.2" opacity="0.98"/>
<circle cx="744" cy="168" r="5" fill="#5EEAD4"/>
<text x="856" y="173" class="font-mono" font-size="13" fill="#E2E8F0" text-anchor="middle">Supabase</text>
</g>
<g class="float-b">
<rect x="976" y="330" width="168" height="36" rx="18" fill="#0F172A" stroke="#7DD3FC" stroke-width="1.2" opacity="0.98"/>
<circle cx="996" cy="348" r="5" fill="#7DD3FC"/>
<text x="1082" y="353" class="font-mono" font-size="13" fill="#E2E8F0" text-anchor="middle">R3F · Three.js</text>
</g>
</svg>