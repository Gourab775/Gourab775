<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="70" viewBox="0 0 1200 70" role="img" aria-label="Neon divider">
<title>Neon divider</title>
<defs>
<linearGradient id="dv-grad" x1="0" y1="0" x2="1" y2="0">
<stop offset="0" stop-color="#22d3ee" stop-opacity="0"/>
<stop offset="0.5" stop-color="#22d3ee"/>
<stop offset="1" stop-color="#7DD3FC" stop-opacity="0"/>
</linearGradient>
</defs>
<rect x="60" y="33" width="1080" height="4" rx="2" fill="url(#dv-grad)" opacity="0.55"/>
<circle cx="60" cy="35" r="11" fill="#22d3ee" opacity="0.22">
<animate attributeName="cx" values="60;1140;60" dur="5s" repeatCount="indefinite"/>
</circle>
<circle cx="60" cy="35" r="5" fill="#22d3ee">
<animate attributeName="cx" values="60;1140;60" dur="5s" repeatCount="indefinite"/>
<animate attributeName="opacity" values="1;.35;1" dur="5s" repeatCount="indefinite"/>
</circle>
</svg>