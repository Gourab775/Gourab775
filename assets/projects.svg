<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1070" viewBox="0 0 1200 1070" role="img" aria-label="Selected projects">
<title>Selected projects</title>
<defs>
<linearGradient id="proj-bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0B1220"/><stop offset="1" stop-color="#0A0F1A"/></linearGradient>
<clipPath id="proj-clip"><rect x="0" y="0" width="1200" height="1070" rx="24"/></clipPath>
<style>
.font-sans{font-family:Inter,ui-sans-serif,system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif}
.font-mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
@keyframes projUp{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:translateY(0)}}
.p1{animation:projUp .7s cubic-bezier(.16,1,.3,1) .05s both}
.p2{animation:projUp .7s cubic-bezier(.16,1,.3,1) .14s both}
.p3{animation:projUp .7s cubic-bezier(.16,1,.3,1) .23s both}
.p4{animation:projUp .7s cubic-bezier(.16,1,.3,1) .32s both}
.p5{animation:projUp .7s cubic-bezier(.16,1,.3,1) .41s both}
.p6{animation:projUp .7s cubic-bezier(.16,1,.3,1) .5s both}
.p7{animation:projUp .7s cubic-bezier(.16,1,.3,1) .59s both}
@media (prefers-reduced-motion:reduce){*{animation:none !important}}
.card{fill:#0F172A;stroke:#1E293B;stroke-width:1.3}
</style>
</defs>
<rect x="0" y="0" width="1200" height="1070" rx="24" fill="url(#proj-bg)" stroke="#1E293B" stroke-width="1.5"/>
<g clip-path="url(#proj-clip)">
