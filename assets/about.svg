<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="470" viewBox="0 0 1200 470" role="img" aria-label="About - What I build">
<title>About — What I build</title>
<defs>
<linearGradient id="about-bg" x1="0" y1="0" x2="1" y2="1">
<stop offset="0" stop-color="#0B1220"/><stop offset="1" stop-color="#0A0F1A"/>
</linearGradient>
<clipPath id="about-clip"><rect x="0" y="0" width="1200" height="470" rx="24"/></clipPath>
<style>
.font-sans{font-family:Inter,ui-sans-serif,system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif}
.font-mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
@keyframes aboutUp{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:translateY(0)}}
.a1{animation:aboutUp .8s cubic-bezier(.16,1,.3,1) .05s both}
.a2{animation:aboutUp .8s cubic-bezier(.16,1,.3,1) .18s both}
.a3{animation:aboutUp .8s cubic-bezier(.16,1,.3,1) .3s both}
.a4{animation:aboutUp .8s cubic-bezier(.16,1,.3,1) .42s both}
.a5{animation:aboutUp .8s cubic-bezier(.16,1,.3,1) .54s both}
@media (prefers-reduced-motion:reduce){*{animation:none !important}}
</style>
</defs>
<rect x="0" y="0" width="1200" height="470" rx="24" fill="url(#about-bg)" stroke="#1E293B" stroke-width="1.5"/>
<g clip-path="url(#about-clip)">
<ellipse cx="150" cy="40" rx="260" ry="110" fill="#5EEAD4" opacity="0.05"/>
<ellipse cx="1080" cy="430" rx="280" ry="120" fill="#7DD3FC" opacity="0.05"/>
</g>
<g class="a1">
<text x="64" y="66" class="font-mono" font-size="13" letter-spacing="2.5" fill="#5EEAD4">ABOUT</text>
<text x="64" y="104" class="font-sans" font-size="36" font-weight="800" fill="#F8FAFC" letter-spacing="-0.8">What I build</text>
<text x="64" y="132" class="font-sans" font-size="15.5" fill="#94A3B8">Grounded in 48 public repos — dashboards, agent workspaces and immersive sites.</text>
</g>
<!-- card 1 -->
<g class="a2">
<rect x="64" y="160" width="341" height="196" rx="18" fill="#0F172A" stroke="#1E293B" stroke-width="1.3"/>
<rect x="64" y="160" width="341" height="4" rx="2" fill="#5EEAD4" opacity="0.85"/>
<circle cx="96" cy="200" r="16" fill="none" stroke="#5EEAD4" stroke-width="1.6"/>
<rect x="89" y="193" width="14" height="10" rx="2" fill="none" stroke="#5EEAD4" stroke-width="1.6"/>
<rect x="89" y="206" width="14" height="3" rx="1.5" fill="#5EEAD4" opacity="0.7"/>
<text x="122" y="206" class="font-sans" font-size="19" font-weight="700" fill="#F1F5F9">Full-Stack Web Apps</text>
<text x="96" y="236" class="font-sans" font-size="14" fill="#CBD5E1">Dashboards, CMS tools, QR ordering</text>
<text x="96" y="258" class="font-sans" font-size="14" fill="#CBD5E1">and agency sites that ship.</text>
<text x="96" y="290" class="font-mono" font-size="12.5" fill="#7DD3FC">Next.js · Supabase / Neon · Clerk</text>
<text x="96" y="312" class="font-mono" font-size="12.5" fill="#64748B">Vercel deploys · clean UI systems</text>
</g>
<!-- card 2 -->
<g class="a3">
<rect x="429" y="160" width="341" height="196" rx="18" fill="#0F172A" stroke="#1E293B" stroke-width="1.3"/>
<rect x="429" y="160" width="341" height="4" rx="2" fill="#7DD3FC" opacity="0.9"/>
<circle cx="461" cy="200" r="16" fill="none" stroke="#7DD3FC" stroke-width="1.6"/>
<path d="M461 190 L464 198 L472 198 L466 203 L468 211 L461 206 L454 211 L456 203 L450 198 L458 198 Z" fill="none" stroke="#7DD3FC" stroke-width="1.5" stroke-linejoin="round"/>
<text x="487" y="206" class="font-sans" font-size="19" font-weight="700" fill="#F1F5F9">AI Workspaces</text>
<text x="461" y="236" class="font-sans" font-size="14" fill="#CBD5E1">Chat assistants, email triage, quiz</text>
<text x="461" y="258" class="font-sans" font-size="14" fill="#CBD5E1">and content flows with agents.</text>
<text x="461" y="290" class="font-mono" font-size="12.5" fill="#7DD3FC">LangGraph · OpenAI Agents</text>
<text x="461" y="312" class="font-mono" font-size="12.5" fill="#64748B">Streaming · human-in-the-loop</text>
</g>
<!-- card 3 -->
<g class="a4">
<rect x="794" y="160" width="342" height="196" rx="18" fill="#0F172A" stroke="#1E293B" stroke-width="1.3"/>
<rect x="794" y="160" width="342" height="4" rx="2" fill="#FCD34D" opacity="0.85"/>
<circle cx="826" cy="200" r="16" fill="none" stroke="#FCD34D" stroke-width="1.6"/>
<path d="M826 192 L833 196 L833 204 L826 208 L819 204 L819 196 Z" fill="none" stroke="#FCD34D" stroke-width="1.5" stroke-linejoin="round"/>
<path d="M826 192 L826 200 L833 204 M826 200 L819 204" fill="none" stroke="#FCD34D" stroke-width="1.2"/>
<text x="852" y="206" class="font-sans" font-size="19" font-weight="700" fill="#F1F5F9">Immersive 3D + Motion</text>
<text x="826" y="236" class="font-sans" font-size="14" fill="#CBD5E1">Configurators, scroll WebGL,</text>
<text x="826" y="258" class="font-sans" font-size="14" fill="#CBD5E1">cinematic product scenes.</text>
<text x="826" y="290" class="font-mono" font-size="12.5" fill="#7DD3FC">Three.js · R3F / Drei · DRACO</text>
<text x="826" y="312" class="font-mono" font-size="12.5" fill="#64748B">Lenis · Motion micro-interactions</text>
</g>
<g class="a5">
<rect x="64" y="376" width="1072" height="50" rx="14" fill="#0C1526" stroke="#1E293B" stroke-width="1.2"/>
<circle cx="92" cy="401" r="5" fill="#5EEAD4"/>
<text x="106" y="406" class="font-mono" font-size="13.5" fill="#CBD5E1">How I work: TypeScript-first · Postgres-backed · serverless on Vercel · small, fast, shippable builds</text>
</g>
</svg>