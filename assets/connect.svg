<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="360" viewBox="0 0 1200 360" role="img" aria-label="Connect">
<title>Connect</title>
<defs>
<linearGradient id="connect-bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0B1220"/><stop offset="1" stop-color="#0A0F1A"/></linearGradient>
<clipPath id="connect-clip"><rect x="0" y="0" width="1200" height="360" rx="24"/></clipPath>
<style>
.font-sans{font-family:Inter,ui-sans-serif,system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif}
.font-mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
@keyframes connUp{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:translateY(0)}}
@keyframes connPulse{0%,100%{opacity:1}50%{opacity:.3}}
.c1{animation:connUp .7s cubic-bezier(.16,1,.3,1) .05s both}
.c2{animation:connUp .7s cubic-bezier(.16,1,.3,1) .18s both}
.c3{animation:connUp .7s cubic-bezier(.16,1,.3,1) .3s both}
.pulse{animation:connPulse 2.2s ease-in-out infinite}
@media (prefers-reduced-motion:reduce){*{animation:none !important}}
</style>
</defs>
<rect x="0" y="0" width="1200" height="360" rx="24" fill="url(#connect-bg)" stroke="#1E293B" stroke-width="1.5"/>
<g clip-path="url(#connect-clip)">
<ellipse cx="150" cy="330" rx="280" ry="120" fill="#5EEAD4" opacity="0.05"/>
<ellipse cx="1070" cy="40" rx="280" ry="120" fill="#7DD3FC" opacity="0.05"/>
</g>
<g class="c1">
<text x="64" y="62" class="font-mono" font-size="13" letter-spacing="2.5" fill="#5EEAD4">CONNECT</text>
<text x="64" y="100" class="font-sans" font-size="34" font-weight="800" fill="#F8FAFC" letter-spacing="-0.7">One verified channel</text>
<text x="64" y="128" class="font-sans" font-size="15" fill="#94A3B8">I only list links I can verify. Everything else lives in the repos.</text>
</g>
<g class="c2">
<rect x="64" y="152" width="620" height="160" rx="18" fill="#0F172A" stroke="#5EEAD4" stroke-width="1.4"/>
<circle cx="116" cy="204" r="26" fill="#13202E" stroke="#334155" stroke-width="1.3"/>
<text x="116" y="213" class="font-sans" font-size="20" font-weight="800" fill="#5EEAD4" text-anchor="middle">GN</text>
<text x="154" y="198" class="font-sans" font-size="22" font-weight="700" fill="#F1F5F9">@Gourab775</text>
<text x="154" y="222" class="font-mono" font-size="13.5" fill="#7DD3FC">github.com/Gourab775</text>
<text x="90" y="258" class="font-mono" font-size="13" fill="#94A3B8">43 public repos · Next.js · AI · 3D · Kolkata, India</text>
<circle cx="104" cy="284" r="5" fill="#34D399" class="pulse"/>
<text x="116" y="289" class="font-sans" font-size="13.5" fill="#CBD5E1">Star a project you like — it helps</text>
</g>
<g class="c3">
<rect x="708" y="152" width="428" height="74" rx="16" fill="#0F172A" stroke="#1E293B" stroke-width="1.3"/>
<text x="736" y="182" class="font-sans" font-size="15.5" font-weight="700" fill="#F1F5F9">What to expect</text>
<text x="736" y="204" class="font-sans" font-size="13.5" fill="#94A3B8">Build notes in READMEs · live Vercel demos</text>
<rect x="708" y="238" width="428" height="74" rx="16" fill="#0C1526" stroke="#1E293B" stroke-width="1.3"/>
<text x="736" y="268" class="font-sans" font-size="15.5" font-weight="700" fill="#F1F5F9">A note on clicks</text>
<text x="736" y="290" class="font-sans" font-size="13.5" fill="#94A3B8">SVG images are not clickable — use links below</text>
</g>
</svg>